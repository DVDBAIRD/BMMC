<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Interactive Photo Globe</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050811;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #globeViz {
      width: 100vw;
      height: 100vh;
    }
    /* Style for photo popup cards */
    .photo-card {
      background: rgba(15, 23, 42, 0.9);
      color: #ffffff;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      max-width: 200px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }
    .photo-card strong {
      font-size: 13px;
      display: block;
      margin-bottom: 6px;
      color: #38bdf8;
    }
    .photo-card img {
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }
  </style>

  <!-- Globe.gl & PapaParse Libraries -->
  <script src="//unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

  <div id="globeViz"></div>

  <script>
    // Direct CSV export link for your specific Google Sheet & GID
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1U3V1JIatKpTOyAHEMnscs0mdZ4vDNf4C7eX_fuUbj_s/export?format=csv&gid=1146027655';

    // Helper function to turn Google Drive links into direct viewable image URLs
    function formatImgUrl(url) {
      if (!url) return '';
      url = url.trim();
      const match = url.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]+)/);
      if (url.includes('drive.google.com') && match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url;
    }

    // Initialize 3D Globe
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .pointOfView({ lat: 20, lng: 0, altitude: 2.2 })
      .htmlElementsData([])
      .htmlElement(d => {
        const el = document.createElement('div');
        el.className = 'photo-card';
        const imgFormatted = formatImgUrl(d.img);
        
        el.innerHTML = `
          <strong>${d.location || 'Unknown Location'}</strong>
          ${imgFormatted ? `<img src="${imgFormatted}" loading="lazy" alt="Photo" />` : ''}
        `;
        return el;
      });

    // Auto-rotation settings
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.6;

    // Fetch and parse Google Sheet CSV
    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      complete: function(results) {
        const points = results.data
          .filter(row => row['Lat'] && row['Lng']) // Ensure coordinates exist in columns AA & AB
          .map(row => ({
            lat: parseFloat(row['Lat'].trim()),
            lng: parseFloat(row['Lng'].trim()),
            img: row['Img1'] ? row['Img1'].trim() : '',      // Column U
            location: row['Made'] ? row['Made'].trim() : ''  // Column X
          }));

        // Load points onto globe
        world.htmlElementsData(points);
      }
    });
  </script>
</body>
</html>
