<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Media & 3D Catalog</title>
  
  <!-- Tailwind CSS for modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PapaParse for direct Google Sheets CSV fetching -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  
  <!-- 3D Model Viewer Web Component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Navigation / Header -->
  <header class="bg-white border-b sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Catalog Showcase</h1>
        <p class="text-xs text-gray-500" id="itemCount">Loading items...</p>
      </div>
      
      <!-- General Search Input -->
      <div class="w-full md:w-96 relative">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by keywords, details, notes..." 
          class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"
        />
        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>

    <!-- Filter Dropdowns Bar -->
    <div class="bg-gray-50 border-t py-3">
      <div class="max-w-7xl mx-auto px-4 grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Age</label>
          <select id="filterAge" class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-2 focus:ring-blue-500">
            <option value="">All Ages</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Type</label>
          <select id="filterType" class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-2 focus:ring-blue-500">
            <option value="">All Types</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Category</label>
          <select id="filterCategory" class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-2 focus:ring-blue-500">
            <option value="">All Categories</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Subcategory</label>
          <select id="filterSubcategory" class="w-full p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-2 focus:ring-blue-500">
            <option value="">All Subcategories</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Cards Grid -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent mb-2"></div>
      <p class="text-gray-500 text-sm">Fetching catalog from Google Sheets...</p>
    </div>
    
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden"></div>
  </main>

  <!-- Detail Pop-up Modal -->
  <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative flex flex-col">
      <button id="closeModal" class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 text-gray-700 p-2 rounded-full z-10 font-bold">
        ✕
      </button>
      <div id="modalContent" class="p-6"></div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // 1. Direct CSV export link for your "Layup" tab (gid=1146027655)
	const CSV_URL = 'https://docs.google.com/spreadsheets/d/1U3V1JIatKpTOyAHEMnscs0mdZ4vDNf4C7eX_fuUbj_s/gviz/tq?tqx=out:csv&gid=1146027655';

    let allData = [];

    // Helper: Finds a field regardless of variations in header names (e.g., "Image 1", "image", "Primary Image")
    function getProp(obj, possibleKeys) {
      const keys = Object.keys(obj);
      for (let p of possibleKeys) {
        const found = keys.find(k => k.trim().toLowerCase() === p.toLowerCase());
        if (found && obj[found]) return obj[found].trim();
      }
      return '';
    }

    // 2. Load Google Sheets Data via PapaParse
    function loadCatalogData() {
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allData = results.data;
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('grid').classList.remove('hidden');
          
          populateDropdowns(allData);
          renderGrid(allData);
        },
        error: function(err) {
          document.getElementById('loading').innerHTML = `
            <p class="text-red-500 font-semibold">Error loading spreadsheet data.</p>
            <p class="text-xs text-gray-500 mt-1">Make sure the sheet is public ("Anyone with the link can view").</p>
          `;
        }
      });
    }

    // 3. Populate Filter Dropdowns
    function populateDropdowns(data) {
      fillSelect('filterAge', data.map(d => getProp(d, ['Age'])));
      fillSelect('filterType', data.map(d => getProp(d, ['Type'])));
      fillSelect('filterCategory', data.map(d => getProp(d, ['Category'])));
      fillSelect('filterSubcategory', data.map(d => getProp(d, ['Subcategory', 'Sub-category', 'Sub Category'])));
    }

    function fillSelect(elementId, values) {
      const select = document.getElementById(elementId);
      const uniqueValues = [...new Set(values.filter(Boolean))].sort();
      uniqueValues.forEach(val => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = val;
        select.appendChild(opt);
      });
      select.addEventListener('change', filterCatalog);
    }

    // 4. Filtering & Search Logic
    function filterCatalog() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const ageVal = document.getElementById('filterAge').value;
      const typeVal = document.getElementById('filterType').value;
      const catVal = document.getElementById('filterCategory').value;
      const subCatVal = document.getElementById('filterSubcategory').value;

      const filtered = allData.filter(item => {
        const itemAge = getProp(item, ['Age']);
        const itemType = getProp(item, ['Type']);
        const itemCat = getProp(item, ['Category']);
        const itemSubCat = getProp(item, ['Subcategory', 'Sub-category', 'Sub Category']);

        const fullTextMatch = JSON.stringify(item).toLowerCase().includes(searchVal);
        const ageMatch = !ageVal || itemAge === ageVal;
        const typeMatch = !typeVal || itemType === typeVal;
        const catMatch = !catVal || itemCat === catVal;
        const subCatMatch = !subCatVal || itemSubCat === subCatVal;

        return fullTextMatch && ageMatch && typeMatch && catMatch && subCatMatch;
      });

      renderGrid(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterCatalog);

    // 5. Render Grid Cards
    function renderGrid(items) {
      const grid = document.getElementById('grid');
      const itemCount = document.getElementById('itemCount');
      grid.innerHTML = '';
      itemCount.textContent = `Showing ${items.length} item${items.length === 1 ? '' : 's'}`;

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-500">
            No results match your selected filters.
          </div>`;
        return;
      }

      items.forEach((item, index) => {
        const title = getProp(item, ['Title', 'Name', 'Item', 'Header']) || `Item #${index + 1}`;
        const img1 = getProp(item, ['Image 1', 'Image', 'Image1', 'Primary Image', 'Photo']) || 'https://via.placeholder.com/400x300?text=No+Image';
        const details = getProp(item, ['Details', 'Detail', 'Description']);
        const category = getProp(item, ['Category']);
        const type = getProp(item, ['Type']);
        const model3D = getProp(item, ['3D Model', '3D', '3DModel', 'Model']);
        const docLink = getProp(item, ['Document', 'Doc', 'PDF', 'Documents']);
        const webLink = getProp(item, ['Web', 'Web Link', 'Website', 'Link', 'URL']);

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-sm hover:shadow-md border border-gray-200 overflow-hidden flex flex-col transition cursor-pointer';
        
        card.innerHTML = `
          <div class="h-48 bg-gray-100 relative overflow-hidden">
            <img src="${img1}" class="w-full h-full object-cover" alt="${title}" loading="lazy" onError="this.src='https://via.placeholder.com/400x300?text=Image+Unavailable'" />
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex gap-1.5 flex-wrap text-[11px] mb-2 font-medium">
                ${category ? `<span class="bg-blue-50 text-blue-700 px-2 py-0.5 rounded">${category}</span>` : ''}
                ${type ? `<span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded">${type}</span>` : ''}
              </div>
              <h3 class="font-bold text-gray-900 text-base mb-1 line-clamp-1">${title}</h3>
              <p class="text-xs text-gray-600 line-clamp-2 mb-3">${details || 'Click for full details and media.'}</p>
            </div>

            <div class="pt-3 border-t border-gray-100 flex items-center justify-between gap-2">
              <span class="text-xs font-semibold text-blue-600 hover:underline">View details →</span>
              <div class="flex gap-1" onclick="event.stopPropagation()">
                ${model3D ? `<a href="${model3D}" target="_blank" title="3D Model" class="bg-purple-100 text-purple-700 p-1.5 rounded hover:bg-purple-200 text-xs">3D</a>` : ''}
                ${docLink ? `<a href="${docLink}" target="_blank" title="Document" class="bg-gray-100 text-gray-700 p-1.5 rounded hover:bg-gray-200 text-xs">Doc</a>` : ''}
                ${webLink ? `<a href="${webLink}" target="_blank" title="Website" class="bg-blue-100 text-blue-700 p-1.5 rounded hover:bg-blue-200 text-xs">Web</a>` : ''}
              </div>
            </div>
          </div>
        `;

        card.addEventListener('click', () => openModal(item));
        grid.appendChild(card);
      });
    }

    // 6. Modal View (Displays Notes, Secondary Image & Links)
    function openModal(item) {
      const title = getProp(item, ['Title', 'Name', 'Item', 'Header']) || 'Item Details';
      const img1 = getProp(item, ['Image 1', 'Image', 'Image1', 'Primary Image', 'Photo']);
      const img2 = getProp(item, ['Image 2', 'Second Image', 'Image2', 'Secondary Image']);
      const details = getProp(item, ['Details', 'Detail', 'Description']);
      const notes = getProp(item, ['Notes', 'Note', 'Comments']);
      const age = getProp(item, ['Age']);
      const type = getProp(item, ['Type']);
      const category = getProp(item, ['Category']);
      const subcategory = getProp(item, ['Subcategory', 'Sub-category', 'Sub Category']);
      const model3D = getProp(item, ['3D Model', '3D', '3DModel', 'Model']);
      const docLink = getProp(item, ['Document', 'Doc', 'PDF', 'Documents']);
      const webLink = getProp(item, ['Web', 'Web Link', 'Website', 'Link', 'URL']);

      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
        <h2 class="text-xl font-bold text-gray-900 mb-2">${title}</h2>
        
        <!-- Metadata Badges -->
        <div class="flex flex-wrap gap-2 text-xs mb-4">
          ${age ? `<span class="bg-gray-100 text-gray-700 px-2 py-1 rounded"><strong>Age:</strong> ${age}</span>` : ''}
          ${type ? `<span class="bg-gray-100 text-gray-700 px-2 py-1 rounded"><strong>Type:</strong> ${type}</span>` : ''}
          ${category ? `<span class="bg-blue-50 text-blue-700 px-2 py-1 rounded"><strong>Category:</strong> ${category}</span>` : ''}
          ${subcategory ? `<span class="bg-blue-50 text-blue-700 px-2 py-1 rounded"><strong>Subcategory:</strong> ${subcategory}</span>` : ''}
        </div>

        <!-- Images Grid -->
        <div class="grid grid-cols-1 ${img2 ? 'sm:grid-cols-2' : ''} gap-4 mb-4">
          ${img1 ? `
            <div>
              <p class="text-xs font-semibold text-gray-500 mb-1">Primary Image</p>
              <img src="${img1}" class="w-full h-48 object-cover rounded-lg border" />
            </div>` : ''}
          ${img2 ? `
            <div>
              <p class="text-xs font-semibold text-gray-500 mb-1">Secondary Image</p>
              <img src="${img2}" class="w-full h-48 object-cover rounded-lg border" />
            </div>` : ''}
        </div>

        <!-- Details & Notes -->
        ${details ? `
          <div class="mb-3">
            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Details</h4>
            <p class="text-sm text-gray-700 whitespace-pre-line bg-gray-50 p-3 rounded-lg border border-gray-100">${details}</p>
          </div>` : ''}

        ${notes ? `
          <div class="mb-4">
            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Notes</h4>
            <p class="text-sm text-gray-700 whitespace-pre-line bg-yellow-50 p-3 rounded-lg border border-yellow-100">${notes}</p>
          </div>` : ''}

        <!-- 3D Viewer (if link is a direct .glb / .gltf model file) -->
        ${model3D && (model3D.endsWith('.glb') || model3D.endsWith('.gltf')) ? `
          <div class="mb-4">
            <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Interactive 3D Model</h4>
            <model-viewer src="${model3D}" camera-controls auto-rotate class="w-full h-64 bg-gray-100 rounded-lg border"></model-viewer>
          </div>` : ''}

        <!-- External Link Buttons -->
        <div class="flex flex-wrap gap-3 pt-4 border-t">
          ${model3D ? `<a href="${model3D}" target="_blank" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-xs font-semibold">Open 3D Model ↗</a>` : ''}
          ${docLink ? `<a href="${docLink}" target="_blank" class="bg-gray-800 hover:bg-black text-white px-4 py-2 rounded-lg text-xs font-semibold">Open Document ↗</a>` : ''}
          ${webLink ? `<a href="${webLink}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-semibold">Visit Website ↗</a>` : ''}
        </div>
      `;

      document.getElementById('detailModal').classList.remove('hidden');
    }

    // Modal Close Listeners
    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('detailModal').classList.add('hidden');
    });
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('detailModal')) {
        document.getElementById('detailModal').classList.add('hidden');
      }
    });

    // Start App
    loadCatalogData();
  </script>
</body>
</html>
