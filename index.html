<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  {% include head.html %}
</head>
<body class="bg-gradient-to-br from-slate-50 via-slate-100/80 to-indigo-50/40 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950/30 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased relative transition-colors duration-300 overflow-x-hidden">

  <!-- Header Section -->
  {% include header.html %}

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex-1 w-full z-10">
    
    <!-- Skeleton Loader -->
    <div id="loading" class="py-6 hidden">
      <div class="flex items-center justify-center gap-2 mb-8">
        <div class="animate-spin rounded-full h-6 w-6 border-2 border-blue-600 border-t-transparent"></div>
        <span class="text-sm font-semibold text-slate-500">Fetching catalog archive...</span>
      </div>
    </div>
    
    <!-- Initial Prompt -->
    <div id="gridPrompt" class="text-center py-16 sm:py-20 bg-white/90 dark:bg-slate-900/90 rounded-3xl border border-dashed border-slate-300 dark:border-slate-800 shadow-sm backdrop-blur-sm hidden">
      <div class="max-w-md mx-auto px-4">
        <div class="w-16 h-16 bg-gradient-to-br from-blue-50 to-indigo-100 dark:from-blue-950/80 dark:to-indigo-950/80 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4 border border-blue-200/60 dark:border-blue-800/60 shadow-inner" id="promptIcon">🔍</div>
        <h3 class="text-lg sm:text-xl font-black text-slate-800 dark:text-slate-100" id="promptTitle">Ready to Explore Exhibits</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-2 mb-6 leading-relaxed" id="promptDesc">Select a Collection Hub above, search by keyword, or view all items in the BMMC archive.</p>
        <button id="btnBrowseAllPrompt" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-xs font-extrabold px-6 py-3.5 rounded-xl shadow-lg shadow-blue-500/25 transition active:scale-95">Browse All →</button>
      </div>
    </div>

    <!-- Exhibit Cards Grid -->
    <div id="gridSection">
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 hidden"></div>
    </div>

    <!-- Stats Dashboard Section -->
    {% include stats.html %}

  </main>

  <!-- Modals & Popups -->
  {% include modals.html %}

  <!-- JavaScript Logic -->
  {% include app_script.html %}

</body>
</html>
