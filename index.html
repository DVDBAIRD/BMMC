<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BMMC Showcase</title>
  
  <!-- Inline Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  
  <!-- PapaParse for direct Google Sheets CSV fetching -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  
  <!-- 3D Model Viewer Web Component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    /* 100% Solid Opaque Header Background */
    .solid-header {
      background-color: #ffffff;
    }
    .dark .solid-header {
      background-color: #0f172a;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased relative transition-colors duration-300">

  <!-- Header -->
  <header id="mainHeader" class="solid-header border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 shadow-md transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      
      <!-- Top Header Row -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
            BMMC Showcase
          </h1>
        </div>
        
        <!-- Action Buttons Bar -->
        <div class="flex flex-wrap items-center gap-2">
          <!-- Permanent Browse All Button -->
          <button id="btnBrowseAllHeader" class="flex items-center gap-1.5 text-xs font-bold text-blue-700 dark:text-blue-300 bg-blue-50 dark:bg-blue-950/60 hover:bg-blue-100 dark:hover:bg-blue-900/60 border border-blue-200 dark:border-blue-800/80 px-3 py-2 rounded-xl transition shadow-sm">
            <span>🌐 Browse All Exhibits</span>
          </button>

          <!-- Surprise Me Button -->
          <button id="btnSurprise" class="flex items-center gap-1.5 text-xs font-bold text-purple-700 dark:text-purple-300 bg-purple-50 dark:bg-purple-950/60 hover:bg-purple-100 dark:hover:bg-purple-900/60 border border-purple-200 dark:border-purple-800/80 px-3 py-2 rounded-xl transition shadow-sm">
            <span>✨ Surprise Me!</span>
          </button>

          <!-- Favorites Toggle -->
          <button id="btnFavorites" class="flex items-center gap-1.5 text-xs font-bold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl transition shadow-sm">
            <span id="favHeartIcon">🤍</span>
            <span id="favCountText">Saved (0)</span>
          </button>

          <!-- Night Mode Theme Toggle -->
          <button id="btnThemeToggle" class="flex items-center gap-1.5 text-xs font-bold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl transition shadow-sm">
            <span id="themeToggleIcon">🌙</span>
            <span id="themeToggleText">Night Mode</span>
          </button>

          <!-- Universal Toggle Controls Button -->
          <button id="toggleControlsBtn" class="flex items-center gap-1.5 text-xs font-bold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 px-3 py-2 rounded-xl transition shadow-sm">
            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
            </svg>
            <span>Search & Filters</span>
            <span id="toggleChevron" class="transition-transform duration-200 text-slate-400">▼</span>
          </button>
        </div>
      </div>

      <!-- Collapsible Container -->
      <div id="collapsibleControls" class="mt-3 flex flex-col gap-3.5 transition-all duration-300">
        
        <!-- Subheading -->
        <p class="text-xs text-slate-600 dark:text-slate-400 font-normal leading-relaxed">
          The Bonniefields Museum of Memorabilia and Curiosities (BMMC) preserves historical artifacts for a nostalgic glimpse into the past.
        </p>

        <!-- Search Bar & Item Counter -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-1 border-t border-slate-200/60 dark:border-slate-800">
          <p class="text-[11px] text-slate-400 font-semibold" id="itemCount"></p>
          
          <div class="w-full sm:w-80 relative">
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Search items, details, notes..." 
              class="w-full pl-10 pr-10 py-2 bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl focus:bg-white dark:focus:bg-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-xs text-slate-800 dark:text-slate-100 transition"
            />
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <button id="clearSearch" class="hidden absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-xs font-bold bg-slate-200 dark:bg-slate-700 rounded-full w-4 h-4 flex items-center justify-center">✕</button>
          </div>
        </div>

        <!-- Filter Dropdowns Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Age</label>
            <select id="filterAge" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-slate-700 dark:text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
              <option value="">All Ages</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Type</label>
            <select id="filterType" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-slate-700 dark:text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
              <option value="">All Types</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Category</label>
            <select id="filterCategory" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-slate-700 dark:text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
              <option value="">All Categories</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Subcategory</label>
            <select id="filterSubcategory" class="w-full p-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-xs font-medium text-slate-700 dark:text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
              <option value="">All Subcategories</option>
            </select>
          </div>
          
          <!-- 3D Models Only Toggle -->
          <div class="col-span-2 sm:col-span-1 flex items-end">
            <button id="btn3DOnly" class="w-full p-2 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-lg text-xs transition flex items-center justify-center gap-1.5 shadow-sm h-[34px]">
              <span>🕶️ 3D Models Only</span>
            </button>
          </div>
        </div>

        <!-- 6 Collection Hubs -->
        <div id="collectionHubsSection" class="hidden pt-2 border-t border-slate-200/60 dark:border-slate-800">
          <div id="hubsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5"></div>
        </div>

      </div>

    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full z-10">
    
    <!-- Loading Spinner -->
    <div id="loading" class="text-center py-24">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent mb-3"></div>
      <p class="text-slate-500 text-sm font-medium">Fetching exhibit catalog from BMMC...</p>
    </div>
    
    <!-- Initial Prompt -->
    <div id="gridPrompt" class="text-center py-16 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-300 dark:border-slate-800 shadow-sm hidden">
      <div class="max-w-md mx-auto px-4">
        <span class="text-3xl mb-2 block">🔍</span>
        <h3 class="text-base font-bold text-slate-800 dark:text-slate-100">Ready to Explore Exhibits</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 mb-4 leading-relaxed">
          Select a Collection Hub above or use search to display exhibit items.
        </p>
        <button id="btnBrowseAllPrompt" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm transition">
          Browse All Exhibits →
        </button>
      </div>
    </div>

    <!-- Exhibit Cards Grid -->
    <div id="gridSection">
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden"></div>
    </div>
  </main>

  <!-- Floating Mobile Jump Pill -->
  <button id="floatingJumpBtn" class="sm:hidden fixed bottom-5 right-5 z-40 bg-blue-600 text-white font-bold text-xs px-4 py-2.5 rounded-full shadow-lg flex items-center gap-1.5 hidden">
    <span>⬇️ View Exhibits</span>
  </button>

  <!-- Detail Pop-up Modal -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative flex flex-col border border-slate-100 dark:border-slate-800">
      <button id="closeModal" class="absolute top-4 right-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-600 dark:text-slate-300 p-2 rounded-full z-10 font-bold transition">
        ✕
      </button>
      <div id="modalContent" class="p-6 sm:p-8"></div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/1U3V1JIatKpTOyAHEMnscs0mdZ4vDNf4C7eX_fuUbj_s/gviz/tq?tqx=out:csv&gid=1146027655';
    const NO_IMAGE_SVG = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22400%22%20height%3D%22300%22%20viewBox%3D%220%200%20400%20300%22%3E%3Crect%20fill%3D%22%23f1f5f9%22%20width%3D%22400%22%20height%3D%22300%22%2F%3E%3Ctext%20fill%3D%22%2394a3b8%22%20font-family%3D%22sans-serif%22%20font-size%3D%2218%22%20font-weight%3D%22bold%22%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%3ENo%20Image%20Available%3C%2Ftext%3E%3C%2Fsvg%3E';

    const MAIN_6_HUB_CATEGORIES = [
      "War", "Photography", "Survey", "General", "Documentation", "Household"
    ];

    let rawRows = [];
    let currentFilteredRows = [];
    let only3DActive = false;
    let showingFavoritesOnly = false;
    let isGridActive = false;
    let currentSpeechUtterance = null;
    let availableVoices = [];

    // Theme Toggle Handler
    function initTheme() {
      const savedTheme = localStorage.getItem('bMMC_theme');
      const isDark = savedTheme === 'dark';
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeUI(isDark);
    }

    function updateThemeUI(isDark) {
      const icon = document.getElementById('themeToggleIcon');
      const text = document.getElementById('themeToggleText');
      if (icon && text) {
        icon.textContent = isDark ? '☀️' : '🌙';
        text.textContent = isDark ? 'Day Mode' : 'Night Mode';
      }
    }

    document.getElementById('btnThemeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('bMMC_theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
    });

    // Detect & Load High Quality Natural Voices
    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      
      const voices = speechSynthesis.getVoices();
      availableVoices = voices.filter(v => v.lang.startsWith('en'));

      const highQualityKeywords = ['natural', 'neural', 'enhanced', 'premium', 'google', 'online', 'siri', 'edge'];

      availableVoices.sort((a, b) => {
        const aName = a.name.toLowerCase();
        const bName = b.name.toLowerCase();
        const aScore = highQualityKeywords.some(k => aName.includes(k)) ? 1 : 0;
        const bScore = highQualityKeywords.some(k => bName.includes(k)) ? 1 : 0;
        return bScore - aScore;
      });

      populateVoiceDropdown();
    }

    function getSelectedVoice() {
      if (availableVoices.length === 0) return null;
      const savedName = localStorage.getItem('bMMC_selectedVoiceName');
      if (savedName) {
        const found = availableVoices.find(v => v.name === savedName);
        if (found) return found;
      }
      return availableVoices[0];
    }

    function populateVoiceDropdown() {
      const select = document.getElementById('voiceSelect');
      if (!select) return;

      select.innerHTML = '';
      const currentVoice = getSelectedVoice();

      availableVoices.forEach(voice => {
        const opt = document.createElement('option');
        opt.value = voice.name;
        const isNatural = ['natural', 'neural', 'enhanced', 'premium', 'google', 'online', 'siri', 'edge'].some(k => voice.name.toLowerCase().includes(k));
        opt.textContent = `${voice.name} ${isNatural ? '✨ (Natural)' : ''}`;
        if (currentVoice && currentVoice.name === voice.name) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });

      select.onchange = function() {
        localStorage.setItem('bMMC_selectedVoiceName', this.value);
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
          const btnModal = document.getElementById('btnAudioGuide');
          if (btnModal && btnModal.getAttribute('data-row')) {
            speakAudioGuide(parseInt(btnModal.getAttribute('data-row')));
          }
        }
      };
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function getVal(row, colIndex) {
      if (!row || !Array.isArray(row) || colIndex >= row.length || row[colIndex] == null) return '';
      return String(row[colIndex]).trim();
    }

    function scrollToGrid() {
      const header = document.getElementById('mainHeader');
      const headerHeight = header ? header.offsetHeight : 100;
      const gridElem = document.getElementById('gridSection');
      if (!gridElem) return;

      const targetPos = gridElem.getBoundingClientRect().top + window.pageYOffset - headerHeight - 16;
      window.scrollTo({ top: Math.max(0, targetPos), behavior: 'smooth' });
    }

    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem('bMMC_favorites') || '[]');
      } catch(e) { return []; }
    }

    function toggleFavorite(rowIndex, event) {
      if (event) event.stopPropagation();
      let favs = getFavorites();
      if (favs.includes(rowIndex)) {
        favs = favs.filter(i => i !== rowIndex);
      } else {
        favs.push(rowIndex);
      }
      localStorage.setItem('bMMC_favorites', JSON.stringify(favs));
      updateFavoritesBadge();
      
      if (isGridActive) {
        filterCatalog(true);
      }
    }

    function updateFavoritesBadge() {
      const favs = getFavorites();
      const heartIcon = document.getElementById('favHeartIcon');
      const favCountText = document.getElementById('favCountText');
      const btnFav = document.getElementById('btnFavorites');

      if (favCountText) favCountText.textContent = `Saved (${favs.length})`;
      if (heartIcon) heartIcon.textContent = favs.length > 0 ? '❤️' : '🤍';

      if (btnFav) {
        if (showingFavoritesOnly) {
          btnFav.classList.add('bg-rose-600', 'text-white', 'border-rose-600');
          btnFav.classList.remove('bg-slate-100', 'text-slate-700', 'border-slate-200', 'dark:bg-slate-800', 'dark:text-slate-200');
        } else {
          btnFav.classList.remove('bg-rose-600', 'text-white', 'border-rose-600');
          btnFav.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-200', 'dark:bg-slate-800', 'dark:text-slate-200');
        }
      }
    }

    function formatImageUrl(url) {
      if (!url) return '';
      url = String(url).trim();
      if (!url.startsWith('http://') && !url.startsWith('https://')) return '';
      
      const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
      }
      return url;
    }

    function parseTitleAndDetails(rawText) {
      if (!rawText) return { title: '', details: '' };
      const lines = String(rawText).split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) return { title: '', details: '' };

      let title = lines[0].replace(/^#\s*/, '');
      let details = lines.slice(1).map(line => line.replace(/^#\s*/, '')).join('\n');
      return { title, details };
    }

    // GOOGLE ITEM SEARCH (Title + Category + "Historical Artifact" + Details - max ~300 chars)
    function googleItemSearch(title, category, details) {
      const cleanDetails = (details || '').replace(/^#\s*/, '').replace(/\s+/g, ' ').trim();
      const shortDetails = cleanDetails.slice(0, 250); // Keep details string concise for Google Search
      
      const query = `${title} ${category || ''} Historical Artifact ${shortDetails}`.trim();
      const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
      window.open(searchUrl, '_blank');
    }

    // Universal Controls Toggle
    const toggleControlsBtn = document.getElementById('toggleControlsBtn');
    const collapsibleControls = document.getElementById('collapsibleControls');
    const toggleChevron = document.getElementById('toggleChevron');

    if (toggleControlsBtn) {
      toggleControlsBtn.addEventListener('click', () => {
        collapsibleControls.classList.toggle('hidden');
        toggleChevron.style.transform = collapsibleControls.classList.contains('hidden') ? 'rotate(180deg)' : 'rotate(0deg)';
      });
    }

    function browseAllExhibits() {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterAge').value = '';
      document.getElementById('filterType').value = '';
      document.getElementById('filterCategory').value = '';
      document.getElementById('filterSubcategory').value = '';
      only3DActive = false;
      showingFavoritesOnly = false;
      
      const btn3D = document.getElementById('btn3DOnly');
      if (btn3D) {
        btn3D.classList.remove('bg-purple-600', 'text-white', 'border-purple-600');
        btn3D.classList.add('bg-white', 'dark:bg-slate-900', 'text-slate-700', 'dark:text-slate-200', 'border-slate-200', 'dark:border-slate-700');
      }
      
      updateFavoritesBadge();
      filterCatalog(true);

      if (window.innerWidth < 640 && collapsibleControls) {
        collapsibleControls.classList.add('hidden');
        if (toggleChevron) toggleChevron.style.transform = 'rotate(180deg)';
      }
      scrollToGrid();
    }

    document.getElementById('btnBrowseAllHeader').addEventListener('click', browseAllExhibits);
    document.getElementById('btnBrowseAllPrompt').addEventListener('click', browseAllExhibits);

    // Surprise Me
    document.getElementById('btnSurprise').addEventListener('click', () => {
      if (!rawRows || rawRows.length === 0) return;
      const randomIndex = Math.floor(Math.random() * rawRows.length);
      openModal(rawRows[randomIndex], randomIndex);
    });

    // 3D Only Toggle
    document.getElementById('btn3DOnly').addEventListener('click', () => {
      only3DActive = !only3DActive;
      const btn = document.getElementById('btn3DOnly');
      if (only3DActive) {
        btn.classList.add('bg-purple-600', 'text-white', 'border-purple-600');
        btn.classList.remove('bg-white', 'dark:bg-slate-900', 'text-slate-700', 'dark:text-slate-200', 'border-slate-200', 'dark:border-slate-700');
      } else {
        btn.classList.remove('bg-purple-600', 'text-white', 'border-purple-600');
        btn.classList.add('bg-white', 'dark:bg-slate-900', 'text-slate-700', 'dark:text-slate-200', 'border-slate-200', 'dark:border-slate-700');
      }
      filterCatalog(true);
    });

    // Favorites Toggle
    document.getElementById('btnFavorites').addEventListener('click', () => {
      showingFavoritesOnly = !showingFavoritesOnly;
      updateFavoritesBadge();
      filterCatalog(true);
    });

    // Floating Mobile Jump Listener
    document.getElementById('floatingJumpBtn').addEventListener('click', () => {
      if (collapsibleControls) {
        collapsibleControls.classList.add('hidden');
        if (toggleChevron) toggleChevron.style.transform = 'rotate(180deg)';
      }
      scrollToGrid();
    });

    // Load Data
    function loadCatalogData() {
      initTheme();
      Papa.parse(CSV_URL, {
        download: true,
        header: false,
        skipEmptyLines: true,
        complete: function(results) {
          try {
            rawRows = results.data.slice(1);
            
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('gridPrompt').classList.remove('hidden');
            
            updateFavoritesBadge();
            renderCollectionHubs(rawRows);
            populateDropdowns(rawRows);
          } catch(e) {
            console.error("Error initializing catalog UI:", e);
            document.getElementById('loading').innerHTML = `
              <p class="text-red-500 font-bold text-base">Error initializing museum catalog.</p>
              <p class="text-xs text-slate-500 mt-1">${e.message}</p>
            `;
          }
        },
        error: function(err) {
          document.getElementById('loading').innerHTML = `
            <p class="text-red-500 font-bold text-base">Error loading spreadsheet data.</p>
            <p class="text-xs text-slate-500 mt-1">Make sure the sheet is public ("Anyone with the link can view").</p>
          `;
        }
      });
    }

    // Render 6 Collection Hubs
    function renderCollectionHubs(rows) {
      const hubsGrid = document.getElementById('hubsGrid');
      if (!hubsGrid) return;
      hubsGrid.innerHTML = '';

      MAIN_6_HUB_CATEGORIES.forEach(catName => {
        const matchingRows = rows.filter(r => getVal(r, 15).toLowerCase().includes(catName.toLowerCase()));
        const count = matchingRows.length;
        if (count === 0) return;

        const firstImgRow = matchingRows.find(r => getVal(r, 20) !== '');
        const firstImgRaw = firstImgRow ? getVal(firstImgRow, 20) : '';
        const previewImg = formatImageUrl(firstImgRaw) || NO_IMAGE_SVG;

        const hubCard = document.createElement('div');
        hubCard.className = 'bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm hover:shadow-md transition duration-300 cursor-pointer flex flex-col group';
        hubCard.innerHTML = `
          <div class="h-20 bg-slate-100/90 dark:bg-slate-800/90 relative overflow-hidden flex items-center justify-center p-1.5">
            <img src="${previewImg}" class="max-w-full max-h-full object-contain group-hover:scale-105 transition-transform duration-300" onError="this.src='${NO_IMAGE_SVG}'" />
            <span class="absolute top-1.5 right-1.5 bg-slate-900/80 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">${count}</span>
          </div>
          <div class="p-2 flex-1 flex flex-col justify-between">
            <h3 class="font-bold text-slate-900 dark:text-slate-100 text-xs group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors line-clamp-1">${catName}</h3>
            <span class="text-[10px] text-blue-600 dark:text-blue-400 font-semibold mt-0.5 flex items-center gap-0.5">Explore →</span>
          </div>
        `;

        hubCard.addEventListener('click', () => {
          document.getElementById('filterCategory').value = catName;
          filterCatalog(true);
          
          if (window.innerWidth < 640 && collapsibleControls) {
            collapsibleControls.classList.add('hidden');
            if (toggleChevron) toggleChevron.style.transform = 'rotate(180deg)';
          }
          scrollToGrid();
        });

        hubsGrid.appendChild(hubCard);
      });

      document.getElementById('collectionHubsSection').classList.remove('hidden');
    }

    // Populate Dropdowns
    function populateDropdowns(rows) {
      fillSelect('filterAge', rows.map(r => getVal(r, 13)));
      fillSelect('filterType', rows.map(r => getVal(r, 14)));
      fillSelect('filterCategory', rows.map(r => getVal(r, 15)));
      fillSelect('filterSubcategory', rows.map(r => getVal(r, 16)));
    }

    function fillSelect(elementId, values) {
      const select = document.getElementById(elementId);
      if (!select) return;
      const uniqueValues = [...new Set(values.filter(Boolean))].sort();
      uniqueValues.forEach(val => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = val;
        select.appendChild(opt);
      });
      select.addEventListener('change', () => {
        filterCatalog(true);
        if (window.innerWidth < 640 && collapsibleControls) {
          collapsibleControls.classList.add('hidden');
          if (toggleChevron) toggleChevron.style.transform = 'rotate(180deg)';
        }
        scrollToGrid();
      });
    }

    // Filter Logic
    function filterCatalog(forceShowGrid = false) {
      const searchVal = (document.getElementById('searchInput').value || '').toLowerCase();
      const ageVal = document.getElementById('filterAge').value;
      const typeVal = document.getElementById('filterType').value;
      const catVal = document.getElementById('filterCategory').value;
      const subCatVal = document.getElementById('filterSubcategory').value;
      const favs = getFavorites();

      document.getElementById('clearSearch').classList.toggle('hidden', !searchVal);

      const isFiltering = searchVal || ageVal || typeVal || catVal || subCatVal || only3DActive || showingFavoritesOnly;

      if (isFiltering || forceShowGrid) {
        isGridActive = true;
        document.getElementById('gridPrompt').classList.add('hidden');
        document.getElementById('grid').classList.remove('hidden');
        document.getElementById('floatingJumpBtn').classList.remove('hidden');
      } else if (!isGridActive) {
        document.getElementById('gridPrompt').classList.remove('hidden');
        document.getElementById('grid').classList.add('hidden');
        document.getElementById('floatingJumpBtn').classList.add('hidden');
        return;
      }

      currentFilteredRows = rawRows.map((row, index) => ({ row, originalIndex: index })).filter(({ row, originalIndex }) => {
        const itemAge = getVal(row, 13);
        const itemType = getVal(row, 14);
        const itemCat = getVal(row, 15);
        const itemSubCat = getVal(row, 16);
        const has3D = getVal(row, 17) !== '';

        const fullTextMatch = row.join(' ').toLowerCase().includes(searchVal);
        const ageMatch = !ageVal || itemAge === ageVal;
        const typeMatch = !typeVal || itemType === typeVal;
        const catMatch = !catVal || itemCat.toLowerCase().includes(catVal.toLowerCase());
        const subCatMatch = !subCatVal || itemSubCat === subCatVal;
        const match3D = !only3DActive || has3D;
        const matchFav = !showingFavoritesOnly || favs.includes(originalIndex);

        return fullTextMatch && ageMatch && typeMatch && catMatch && subCatMatch && match3D && matchFav;
      });

      renderGrid(currentFilteredRows);
    }

    document.getElementById('searchInput').addEventListener('input', () => filterCatalog(true));
    document.getElementById('clearSearch').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      filterCatalog(true);
    });

    // AUDIO NARRATOR
    function speakAudioGuide(originalIndex, event) {
      if (event) event.stopPropagation();

      const row = rawRows[originalIndex];
      if (!row) return;

      const notes = getVal(row, 4);
      if (!notes || notes.trim() === '') {
        alert('No Museum Notes available for audio narration on this exhibit.');
        return;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        
        const cleanNotes = notes.replace(/^#\s*/, '');
        const textToSpeak = `Museum Note: ${cleanNotes}`;
        currentSpeechUtterance = new SpeechSynthesisUtterance(textToSpeak);
        
        const chosenVoice = getSelectedVoice();
        if (chosenVoice) {
          currentSpeechUtterance.voice = chosenVoice;
        }

        currentSpeechUtterance.rate = 0.92;
        currentSpeechUtterance.pitch = 1.0;
        
        const btnModal = document.getElementById('btnAudioGuide');
        if (btnModal) {
          btnModal.setAttribute('data-row', originalIndex);
          btnModal.innerHTML = '⏹️ Stop Audio Guide';
          btnModal.onclick = stopAudioGuide;
        }

        currentSpeechUtterance.onend = () => {
          if (btnModal) {
            btnModal.innerHTML = '🔊 Listen to Notes';
            btnModal.onclick = () => speakAudioGuide(originalIndex);
          }
        };

        window.speechSynthesis.speak(currentSpeechUtterance);
      } else {
        alert('Speech Synthesis is not supported in this browser.');
      }
    }

    function stopAudioGuide() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const btnModal = document.getElementById('btnAudioGuide');
        if (btnModal) {
          btnModal.innerHTML = '🔊 Listen to Notes';
          const rowIdx = btnModal.getAttribute('data-row');
          if (rowIdx) {
            btnModal.onclick = () => speakAudioGuide(parseInt(rowIdx));
          }
        }
      }
    }

    // Render Cards Grid
    function renderGrid(items) {
      const grid = document.getElementById('grid');
      const itemCount = document.getElementById('itemCount');
      const favs = getFavorites();
      
      grid.innerHTML = '';
      if (itemCount) itemCount.textContent = `Showing ${items.length} item${items.length === 1 ? '' : 's'}`;

      if (items.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 bg-white dark:bg-slate-900 rounded-2xl border border-dashed border-slate-200 dark:border-slate-800">
            <p class="text-slate-500 dark:text-slate-400 font-medium">No exhibit results match your selected filters.</p>
          </div>`;
        return;
      }

      items.forEach(({ row, originalIndex }) => {
        const rawContent = getVal(row, 2) || getVal(row, 0);
        const { title, details } = parseTitleAndDetails(rawContent);
        const displayTitle = title || `Exhibit Item #${originalIndex + 1}`;

        const notes = getVal(row, 4);                          // Column E (4): Museum Notes
        const age = getVal(row, 13);
        const type = getVal(row, 14);
        const category = getVal(row, 15);
        const subcategory = getVal(row, 16);
        const d3d = getVal(row, 17);
        const ddoc = getVal(row, 18);
        const dweb = getVal(row, 19);
        
        const img1Raw = getVal(row, 20);
        const img1 = formatImageUrl(img1Raw) || NO_IMAGE_SVG;
        const isFav = favs.includes(originalIndex);

        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-900 rounded-2xl shadow-sm hover:shadow-xl border border-slate-200/80 dark:border-slate-800 overflow-hidden flex flex-col transition-all duration-300 transform hover:-translate-y-1 cursor-pointer group relative';
        
        card.innerHTML = `
          <div class="h-56 bg-slate-100/80 dark:bg-slate-800/80 relative overflow-hidden flex items-center justify-center p-2">
            <a href="${img1}" target="_blank" onclick="event.stopPropagation()" title="Open full image in new tab" class="w-full h-full flex items-center justify-center relative group/img">
              <img 
                src="${img1}" 
                class="max-w-full max-h-full object-contain group-hover/img:scale-105 transition-transform duration-300" 
                alt="${displayTitle}" 
                loading="lazy" 
                onError="this.src='${NO_IMAGE_SVG}'" 
              />
            </a>

            <!-- Heart Button -->
            <button 
              onclick="toggleFavorite(${originalIndex}, event)" 
              title="${isFav ? 'Remove from favorites' : 'Save to favorites'}"
              class="absolute top-3 right-3 p-1.5 rounded-full backdrop-blur-md transition shadow-sm ${isFav ? 'bg-rose-500 text-white' : 'bg-white/90 dark:bg-slate-800/90 text-slate-400 hover:text-rose-500'}"
            >
              ${isFav ? '❤️' : '🤍'}
            </button>

            <!-- Audio Speaker Button -->
            ${notes ? `
              <button 
                onclick="speakAudioGuide(${originalIndex}, event)" 
                title="Listen to Museum Notes"
                class="absolute top-12 right-3 p-1.5 rounded-full bg-white/90 dark:bg-slate-800/90 text-blue-600 dark:text-blue-400 hover:text-blue-700 backdrop-blur-md transition shadow-sm text-xs font-bold"
              >
                🔊
              </button>
            ` : ''}

            ${age ? `<span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-sm text-white px-2.5 py-1 rounded-full text-[10px] font-semibold tracking-wide pointer-events-none">${age}</span>` : ''}
          </div>
          
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex gap-1.5 flex-wrap text-[11px] mb-2 font-semibold">
                ${category ? `<span class="bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 px-2.5 py-0.5 rounded-full border border-blue-100 dark:border-blue-900">${category}</span>` : ''}
                ${type ? `<span class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2.5 py-0.5 rounded-full">${type}</span>` : ''}
                ${subcategory ? `<span class="bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-100 dark:border-emerald-900">${subcategory}</span>` : ''}
              </div>
              
              <h3 class="font-bold text-slate-900 dark:text-slate-100 text-sm mb-1.5 line-clamp-1 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">${displayTitle}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-4 leading-relaxed">${details || 'Click for full details and museum notes.'}</p>
            </div>

            <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-2">
              <span class="text-xs font-semibold text-blue-600 dark:text-blue-400 flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                Details 
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
              </span>
              
              <div class="flex gap-1.5" onclick="event.stopPropagation()">
                ${d3d ? `<a href="${d3d}" target="_blank" title="3D Model" class="bg-purple-50 dark:bg-purple-950 text-purple-700 dark:text-purple-300 hover:bg-purple-600 hover:text-white px-2.5 py-1 rounded-md text-xs font-semibold border border-purple-200 dark:border-purple-800 transition">3D</a>` : ''}
                ${ddoc ? `<a href="${ddoc}" target="_blank" title="Documentation" class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-800 hover:text-white px-2.5 py-1 rounded-md text-xs font-semibold transition">Doc</a>` : ''}
                ${dweb ? `<a href="${dweb}" target="_blank" title="Website" class="bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 hover:bg-blue-600 hover:text-white px-2.5 py-1 rounded-md text-xs font-semibold border border-blue-200 dark:border-blue-800 transition">Web</a>` : ''}
              </div>
            </div>
          </div>
        `;

        card.addEventListener('click', () => openModal(row, originalIndex));
        grid.appendChild(card);
      });
    }

    // Modal View
    function openModal(row, originalIndex) {
      stopAudioGuide();
      
      const rawContent = getVal(row, 2) || getVal(row, 0);
      const { title, details } = parseTitleAndDetails(rawContent);
      const displayTitle = title || 'Exhibit Item Details';

      const notes = getVal(row, 4);                          // Column E (4): Museum Notes
      const age = getVal(row, 13);
      const type = getVal(row, 14);
      const category = getVal(row, 15);
      const subcategory = getVal(row, 16);
      const d3d = getVal(row, 17);
      const ddoc = getVal(row, 18);
      const dweb = getVal(row, 19);
      
      const img1 = formatImageUrl(getVal(row, 20));
      const img2 = formatImageUrl(getVal(row, 21));
      const favs = getFavorites();
      const isFav = favs.includes(originalIndex);

      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = `
        <div class="flex items-start justify-between gap-4 mb-3 pr-8">
          <h2 class="text-xl font-bold text-slate-900 dark:text-white">${displayTitle}</h2>
          <button 
            onclick="toggleFavorite(${originalIndex}, event)" 
            class="px-3 py-1 rounded-full text-xs font-bold border transition flex items-center gap-1 ${isFav ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-200'}"
          >
            ${isFav ? '❤️ Saved' : '🤍 Save'}
          </button>
        </div>

        <div class="flex flex-wrap gap-2 text-xs mb-4">
          ${age ? `<span class="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-3 py-1 rounded-full font-medium"><strong>Age:</strong> ${age}</span>` : ''}
          ${type ? `<span class="bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-3 py-1 rounded-full font-medium"><strong>Type:</strong> ${type}</span>` : ''}
          ${category ? `<span class="bg-blue-50 dark:bg-blue-950 text-blue-800 dark:text-blue-200 border border-blue-100 dark:border-blue-900 px-3 py-1 rounded-full font-medium"><strong>Category:</strong> ${category}</span>` : ''}
          ${subcategory ? `<span class="bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 border border-emerald-100 dark:border-emerald-900 px-3 py-1 rounded-full font-medium"><strong>Subcategory:</strong> ${subcategory}</span>` : ''}
        </div>

        <!-- Images Comparison -->
        <div class="grid grid-cols-1 ${img2 ? 'sm:grid-cols-2' : ''} gap-4 mb-4">
          ${img1 ? `
            <div>
              <!-- Header Line Above Primary Image: Label + Audio Controls + Google Item Link -->
              <div class="flex flex-wrap items-center justify-between gap-1.5 mb-1.5">
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider shrink-0">Primary Image</p>

                <!-- Compact Audio Guide & Voice Selector -->
                ${notes ? `
                  <div class="flex items-center gap-1 shrink-0">
                    <button 
                      id="btnAudioGuide" 
                      data-row="${originalIndex}"
                      onclick="speakAudioGuide(${originalIndex})"
                      class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-0.5 rounded text-[10px] font-bold transition shadow-sm"
                    >
                      🔊 Listen
                    </button>
                    <select id="voiceSelect" class="text-[10px] bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded p-0.5 font-medium max-w-[100px] truncate outline-none">
                      <!-- Populated dynamically -->
                    </select>
                  </div>
                ` : ''}

                <!-- Google Item Search Button -->
                <button 
                  onclick="googleItemSearch('${displayTitle.replace(/'/g, "\\'")}', '${category.replace(/'/g, "\\'")}', '${details.replace(/'/g, "\\'").replace(/\n/g, ' ')}')"
                  title="Google this item with Title, Category, Historical Artifact, and Details"
                  class="text-[10px] font-bold text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-0.5 shrink-0 ml-auto"
                >
                  🔍 Google Item
                </button>
              </div>

              <!-- Primary Image Box -->
              <a href="${img1}" target="_blank" title="Click to view full image in new tab" class="block group relative overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800 p-2">
                <img src="${img1}" class="w-full h-56 object-contain rounded-lg group-hover:scale-105 transition-transform duration-300" onError="this.src='${NO_IMAGE_SVG}'" />
                <span class="absolute bottom-3 right-3 bg-slate-900/80 text-white text-[10px] px-2 py-1 rounded shadow">Open Full Image ↗</span>
              </a>
            </div>` : ''}

          ${img2 ? `
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Second Image</p>
                <button 
                  onclick="googleItemSearch('${displayTitle.replace(/'/g, "\\'")}', '${category.replace(/'/g, "\\'")}', '${details.replace(/'/g, "\\'").replace(/\n/g, ' ')}')"
                  title="Google this item with Title, Category, Historical Artifact, and Details"
                  class="text-[10px] font-bold text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-0.5"
                >
                  🔍 Google Item
                </button>
              </div>
              <a href="${img2}" target="_blank" title="Click to view second image in new tab" class="block group relative overflow-hidden rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800 p-2">
                <img src="${img2}" class="w-full h-56 object-contain rounded-lg group-hover:scale-105 transition-transform duration-300" onError="this.src='${NO_IMAGE_SVG}'" />
                <span class="absolute bottom-3 right-3 bg-slate-900/80 text-white text-[10px] px-2 py-1 rounded shadow">Open Full Image ↗</span>
              </a>
            </div>` : ''}
        </div>

        ${details ? `
          <div class="mb-4">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Details</h4>
            <div class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-line bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-100 dark:border-slate-800">${details}</div>
          </div>` : ''}

        ${notes ? `
          <div class="mb-6">
            <h4 class="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider mb-1.5">Museum Notes</h4>
            <div class="text-sm text-amber-900 dark:text-amber-200 leading-relaxed whitespace-pre-line bg-amber-50/70 dark:bg-amber-950/40 p-4 rounded-xl border border-amber-200/60 dark:border-amber-900/60">${notes}</div>
          </div>` : ''}

        ${d3d && (d3d.endsWith('.glb') || d3d.endsWith('.gltf')) ? `
          <div class="mb-6">
            <h4 class="text-xs font-bold text-purple-600 dark:text-purple-400 uppercase tracking-wider mb-1.5">Interactive 3D Viewer</h4>
            <model-viewer src="${d3d}" camera-controls auto-rotate class="w-full h-72 bg-slate-900 rounded-xl overflow-hidden"></model-viewer>
          </div>` : ''}

        <div class="flex flex-wrap gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
          ${d3d ? `<a href="${d3d}" target="_blank" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm transition">3D Model ↗</a>` : ''}
          ${ddoc ? `<a href="${ddoc}" target="_blank" class="bg-slate-800 hover:bg-black text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm transition">Documentation ↗</a>` : ''}
          ${dweb ? `<a href="${dweb}" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm transition">Web Link ↗</a>` : ''}
        </div>
      `;

      populateVoiceDropdown();
      document.getElementById('detailModal').classList.remove('hidden');
    }

    // Modal Close
    document.getElementById('closeModal').addEventListener('click', () => {
      stopAudioGuide();
      document.getElementById('detailModal').classList.add('hidden');
    });
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('detailModal')) {
        stopAudioGuide();
        document.getElementById('detailModal').classList.add('hidden');
      }
    });

    // Start App
    loadCatalogData();
  </script>
</body>
</html>
