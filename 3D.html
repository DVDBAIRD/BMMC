<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Collection</title>

  <!-- Google <model-viewer> Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 32px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-sub);
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Card Styling */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.15);
    }

    /* Auto-rendered 3D Thumbnail Container */
    .card-thumb {
      width: 100%;
      height: 200px;
      background-color: #f1f5f9;
      position: relative;
      pointer-events: none;
    }

    .card-thumb model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    .card-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--border-color);
      background: var(--card-bg);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-view {
      flex-grow: 1;
      background: rgba(2, 132, 199, 0.08);
      color: var(--accent);
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .card:hover .btn-view {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-details {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn-details:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }

    /* Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 1000px;
      height: 80vh;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      padding: 16px 24px;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .modal-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: hidden;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-details-link {
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      background: rgba(2, 132, 199, 0.08);
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .modal-details-link:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
      padding-left: 12px;
    }

    .close-btn:hover { color: var(--text-main); }

    .viewer-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated Loader Overlay */
    .spinner-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      gap: 16px;
      z-index: 5;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(2, 132, 199, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #modal-viewer {
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #modal-viewer.loaded {
      opacity: 1;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-sub);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>3D Interactive Collection</h1>
    <p>Click any model to open in interactive 3D</p>
  </header>

  <div class="gallery-grid" id="gallery">
    <div class="status-msg">Fetching models from Google Sheet...</div>
  </div>

  <!-- Lightbox Modal -->
  <div class="modal" id="viewer-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-header-left">
          <h2 id="modal-title">Loading...</h2>
          <a id="modal-details-link" class="modal-details-link" target="_blank" rel="noopener" style="display: none;">Details ↗</a>
        </div>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      
      <div class="viewer-container">
        <div class="spinner-overlay" id="modal-loader">
          <div class="spinner"></div>
          <p style="color: var(--text-sub); font-size: 0.9rem;">Loading 3D Model...</p>
        </div>

        <model-viewer 
          id="modal-viewer" 
          camera-controls 
          auto-rotate 
          shadow-intensity="1.2"
          exposure="1.1"
          touch-action="pan-y">
        </model-viewer>
      </div>
    </div>
  </div>

  <script>
    // Google Sheets CSV Endpoint (Tab gid=2093054295)
    const SHEET_ID = '1U3V1JIatKpTOyAHEMnscs0mdZ4vDNf4C7eX_fuUbj_s';
    const GID = '2093054295';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('viewer-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDetailsLink = document.getElementById('modal-details-link');
    const modalViewer = document.getElementById('modal-viewer');
    const modalLoader = document.getElementById('modal-loader');

    // RFC-compliant CSV Parser
    function parseCSV(text) {
      const lines = text.split(/\r?\n/);
      return lines.map(line => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(current.trim().replace(/^"|"$/g, ''));
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim().replace(/^"|"$/g, ''));
        return result;
      });
    }

    // Title fallback helper
    function extractTitleFromUrl(url) {
      const fileName = url.split('/').pop().split('?')[0];
      return fileName
        .replace('.glb', '')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    // Fetch Google Sheet & Populate Grid
    async function loadGalleryFromCSV() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) {
          throw new Error(`Failed to fetch Google Sheet (Status: ${response.status}). Ensure sharing is set to "Anyone with the link can view".`);
        }

        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if (rows.length === 0) {
          gallery.innerHTML = '<div class="status-msg">No data found in Google Sheet.</div>';
          return;
        }

        // Column B = Index 1 (Origin / 3D Model)
        // Column E = Index 4 (Title)
        // Column F = Index 5 (Details)
        let modelColIndex = 1; 
        let titleColIndex = 4;  
        let detailsColIndex = 5; 

        // Dynamic header detection
        const headerRow = rows[0];

        const modelIdx = headerRow.findIndex(cell => {
          const c = cell.toLowerCase().trim();
          return c === 'origin' || c.includes('3d model') || c === 'model';
        });
        if (modelIdx !== -1) modelColIndex = modelIdx;

        const titleIdx = headerRow.findIndex(cell => {
          const c = cell.toLowerCase().trim();
          return c === 'title' || c === 'item';
        });
        if (titleIdx !== -1) titleColIndex = titleIdx;

        const detailsIdx = headerRow.findIndex(cell => {
          const c = cell.toLowerCase().trim();
          return c === 'details' || c.includes('detail');
        });
        if (detailsIdx !== -1) detailsColIndex = detailsIdx;

        const startRow = (modelIdx !== -1 || titleIdx !== -1 || detailsIdx !== -1) ? 1 : 0;
        const items = [];

        for (let i = startRow; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length <= modelColIndex) continue;

          let rawUrl = row[modelColIndex]?.trim();
          if (!rawUrl || !rawUrl.startsWith('http')) continue;

          // Process Dropbox URLs to direct raw links
          if (rawUrl.includes('dropbox.com')) {
            rawUrl = rawUrl.replace('dl=0', 'raw=1').replace('dl=1', 'raw=1');
            if (!rawUrl.includes('raw=1')) {
              rawUrl += (rawUrl.includes('?') ? '&raw=1' : '?raw=1');
            }
          }

          // Get Title from Column E (Title/Item) or fallback to URL filename
          let customTitle = row[titleColIndex]?.trim();
          if (!customTitle) {
            customTitle = extractTitleFromUrl(rawUrl);
          }

          // Get Details URL from Column F (Details)
          let detailsUrl = row[detailsColIndex]?.trim();
          if (detailsUrl && !detailsUrl.startsWith('http')) {
            detailsUrl = 'https://' + detailsUrl;
          }

          items.push({
            title: customTitle,
            url: rawUrl,
            detailsUrl: detailsUrl || null
          });
        }

        gallery.innerHTML = ''; // Clear status message

        if (items.length === 0) {
          gallery.innerHTML = '<div class="status-msg">No valid GLB model links found in Column B.</div>';
          return;
        }

        // Render Gallery Cards
        items.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openModal(item);

          const detailsBtnHtml = item.detailsUrl 
            ? `<a class="btn-details" href="${item.detailsUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Details ↗</a>`
            : '';

          card.innerHTML = `
            <div class="card-thumb">
              <model-viewer 
                src="${item.url}" 
                loading="lazy" 
                auto-rotate 
                rotation-per-second="20deg" 
                interaction-prompt="none" 
                shadow-intensity="0.4">
              </model-viewer>
            </div>
            <div class="card-info">
              <div class="card-title" title="${item.title}">${item.title}</div>
              <div class="card-actions">
                <button class="btn-view">View 3D</button>
                ${detailsBtnHtml}
              </div>
            </div>
          `;

          gallery.appendChild(card);
        });

      } catch (err) {
        console.error("CSV Fetch Error:", err);
        gallery.innerHTML = `
          <div class="status-msg" style="color: #ef4444;">
            <p>⚠️ Failed to load Google Sheet.</p>
            <p style="font-size: 0.85rem; margin-top: 8px;">${err.message}</p>
          </div>
        `;
      }
    }

    // Modal Control
    function openModal(item) {
      modalTitle.textContent = item.title;

      if (item.detailsUrl) {
        modalDetailsLink.href = item.detailsUrl;
        modalDetailsLink.style.display = 'inline-block';
      } else {
        modalDetailsLink.style.display = 'none';
      }

      modalViewer.classList.remove('loaded');
      modalLoader.style.display = 'flex';
      modalLoader.style.opacity = '1';
      
      modalViewer.src = item.url;
      modal.classList.add('active');
    }

    modalViewer.addEventListener('load', () => {
      modalLoader.style.opacity = '0';
      setTimeout(() => {
        modalLoader.style.display = 'none';
        modalViewer.classList.add('loaded');
      }, 300);
    });

    function closeModal() {
      modal.classList.remove('active');
      modalViewer.classList.remove('loaded');
      modalViewer.removeAttribute('src');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // Run on startup
    loadGalleryFromCSV();
  </script>
</body>
</html>
