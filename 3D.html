<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Collection</title>

  <!-- Google <model-viewer> Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 32px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-sub);
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Card Styling */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.15);
    }

    /* Auto-rendered 3D Thumbnail Container */
    .card-thumb {
      width: 100%;
      height: 200px;
      background-color: #f1f5f9;
      position: relative;
      pointer-events: none;
    }

    .card-thumb model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    .card-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--border-color);
      background: var(--card-bg);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .btn-view {
      align-self: flex-start;
      background: rgba(2, 132, 199, 0.08);
      color: var(--accent);
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .card:hover .btn-view {
      background: var(--accent);
      color: #ffffff;
    }

    /* Modal Overlay */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 1000px;
      height: 80vh;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      padding: 16px 24px;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover { color: var(--text-main); }

    .viewer-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated Loader Overlay */
    .spinner-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      gap: 16px;
      z-index: 5;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(2, 132, 199, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #modal-viewer {
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #modal-viewer.loaded {
      opacity: 1;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-sub);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>3D Interactive Collection</h1>
    <p>Click any model to open in interactive 3D</p>
  </header>

  <div class="gallery-grid" id="gallery">
    <div class="status-msg">Fetching models from Google Sheet...</div>
  </div>

  <!-- Lightbox Modal -->
  <div class="modal" id="viewer-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title">Loading...</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      
      <div class="viewer-container">
        <div class="spinner-overlay" id="modal-loader">
          <div class="spinner"></div>
          <p style="color: var(--text-sub); font-size: 0.9rem;">Loading 3D Model...</p>
        </div>

        <model-viewer 
          id="modal-viewer" 
          camera-controls 
          auto-rotate 
          shadow-intensity="1.2"
          exposure="1.1"
          touch-action="pan-y">
        </model-viewer>
      </div>
    </div>
  </div>

  <script>
    // Google Sheets CSV Endpoint (Tab gid=425957921)
    const SHEET_ID = '1U3V1JIatKpTOyAHEMnscs0mdZ4vDNf4C7eX_fuUbj_s';
    const GID = '425957921';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById('viewer-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalViewer = document.getElementById('modal-viewer');
    const modalLoader = document.getElementById('modal-loader');

    // RFC-compliant CSV Parser
    function parseCSV(text) {
      const lines = text.split(/\r?\n/);
      return lines.map(line => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(current.trim().replace(/^"|"$/g, ''));
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim().replace(/^"|"$/g, ''));
        return result;
      });
    }

    // Title fallback helper
    function extractTitleFromUrl(url) {
      const fileName = url.split('/').pop().split('?')[0];
      return fileName
        .replace('.glb', '')
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    // Fetch Google Sheet & Populate Grid
    async function loadGalleryFromCSV() {
      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) {
          throw new Error(`Failed to fetch Google Sheet (Status: ${response.status}). Ensure sharing is set to "Anyone with the link can view".`);
        }

        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if (rows.length === 0) {
          gallery.innerHTML = '<div class="status-msg">No data found in Google Sheet.</div>';
          return;
        }

        // Column E = Index 4 (Item)
        // Column V = Index 21 (3D Model)
        let titleColIndex = 4;  
        let modelColIndex = 21; 

        // Dynamic header detection
        const headerRow = rows[0];
        const itemIdx = headerRow.findIndex(cell => cell.toLowerCase().trim() === 'item');
        if (itemIdx !== -1) titleColIndex = itemIdx;

        const modelIdx = headerRow.findIndex(cell => cell.toLowerCase().trim().includes('3d model') || cell.toLowerCase().trim() === 'model');
        if (modelIdx !== -1) modelColIndex = modelIdx;

        const startRow = (itemIdx !== -1 || modelIdx !== -1) ? 1 : 0;
        const items = [];

        for (let i = startRow; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length <= modelColIndex) continue;

          let rawUrl = row[modelColIndex]?.trim();
          if (!rawUrl || !rawUrl.startsWith('http')) continue;

          // Process Dropbox URLs to direct raw links
          if (rawUrl.includes('dropbox.com')) {
            rawUrl = rawUrl.replace('dl=0', 'raw=1').replace('dl=1', 'raw=1');
            if (!rawUrl.includes('raw=1')) {
              rawUrl += (rawUrl.includes('?') ? '&raw=1' : '?raw=1');
            }
          }

          // Get Title from Column E (Item) or fallback to URL filename
          let customTitle = row[titleColIndex]?.trim();
          if (!customTitle) {
            customTitle = extractTitleFromUrl(rawUrl);
          }

          items.push({
            title: customTitle,
            url: rawUrl
          });
        }

        gallery.innerHTML = ''; // Clear status message

        if (items.length === 0) {
          gallery.innerHTML = '<div class="status-msg">No valid GLB model links found in Column V.</div>';
          return;
        }

        // Render Gallery Cards
        items.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openModal(item);

          card.innerHTML = `
            <div class="card-thumb">
              <model-viewer 
                src="${item.url}" 
                loading="lazy" 
                auto-rotate 
                rotation-per-second="20deg" 
                interaction-prompt="none" 
                shadow-intensity="0.4">
              </model-viewer>
            </div>
            <div class="card-info">
              <div class="card-title" title="${item.title}">${item.title}</div>
              <button class="btn-view">View Interactive 3D</button>
            </div>
          `;

          gallery.appendChild(card);
        });

      } catch (err) {
        console.error("CSV Fetch Error:", err);
        gallery.innerHTML = `
          <div class="status-msg" style="color: #ef4444;">
            <p>⚠️ Failed to load Google Sheet.</p>
            <p style="font-size: 0.85rem; margin-top: 8px;">${err.message}</p>
          </div>
        `;
      }
    }

    // Modal Control
    function openModal(item) {
      modalTitle.textContent = item.title;
      modalViewer.classList.remove('loaded');
      modalLoader.style.display = 'flex';
      modalLoader.style.opacity = '1';
      
      modalViewer.src = item.url;
      modal.classList.add('active');
    }

    modalViewer.addEventListener('load', () => {
      modalLoader.style.opacity = '0';
      setTimeout(() => {
        modalLoader.style.display = 'none';
        modalViewer.classList.add('loaded');
      }, 300);
    });

    function closeModal() {
      modal.classList.remove('active');
      modalViewer.classList.remove('loaded');
      modalViewer.removeAttribute('src');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // Run on startup
    loadGalleryFromCSV();
  </script>
</body>
</html>
