<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Globe Map (No Auto-Rotation)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050811; font-family: sans-serif; }
    #globeViz { width: 100vw; height: 100vh; }
    
    .info-card {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      max-width: 250px;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid #38bdf8;
    }
    .info-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 8px;
    }
  </style>

  <script src="//unpkg.com/globe.gl"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>

  <div id="globeViz"></div>
  <div id="photoCard" class="info-card"></div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/1U3V1JIatKpTOyAHEMnscs0mdZ4vDNf4C7eX_fuUbj_s/gviz/tq?tqx=out:csv&gid=1146027655';

    function formatImgUrl(url) {
      if (!url) return '';
      url = url.trim();
      const match = url.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]+)/);
      if (url.includes('drive.google.com') && match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url;
    }

    function getColValue(row, targetKeys) {
      for (let key in row) {
        const cleanKey = key.trim().toLowerCase();
        for (let target of targetKeys) {
          if (cleanKey === target.toLowerCase()) {
            return row[key] ? row[key].toString().trim() : '';
          }
        }
      }
      return '';
    }

    // Initialize Globe
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      .pointOfView({ lat: 20, lng: 0, altitude: 2.2 })
      // Render 3D Heat Columns instead of overlapping photos
      .pointsData([])
      .pointAltitude(0.15)
      .pointColor(() => '#ff4500')
      .pointRadius(0.6)
      .onPointClick(d => {
        const card = document.getElementById('photoCard');
        const imgUrl = formatImgUrl(d.img);
        card.style.display = 'block';
        card.innerHTML = `
          <strong>${d.location || 'Location'}</strong>
          ${imgUrl ? `<img src="${imgUrl}"/>` : ''}
        `;
      });

    // DISABLE AUTO-ROTATION SO MAP DOES NOT TURN DURING NAVIGATION
    world.controls().autoRotate = false;

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const points = [];
        results.data.forEach(row => {
          const latVal = getColValue(row, ['Lat', 'AA']);
          const lngVal = getColValue(row, ['Lng', 'AB']);
          
          if (latVal && lngVal && !isNaN(latVal) && !isNaN(lngVal)) {
            points.push({
              lat: parseFloat(latVal),
              lng: parseFloat(lngVal),
              img: getColValue(row, ['Img1', 'U']),
              location: getColValue(row, ['Made', 'X'])
            });
          }
        });

        world.pointsData(points);
      }
    });
  </script>
</body>
</html>
